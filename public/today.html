<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Siso Collections Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;background:#0b1320;color:#e6eef8}
    header{padding:16px;background:#071126;display:flex;justify-content:space-between;align-items:center}
    h1{margin:0;font-size:20px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px;text-align:left;vertical-align:top}
    tr:not(:first-child){border-top:1px solid rgba(255,255,255,0.06)}
    .status{font-weight:600;padding:6px 12px;border-radius:8px;display:inline-block}
    .status.notpicked{background:#6b1f1f;color:#ffecec}
    .status.preparing{background:#6b4d1f;color:#fff8e0}
    .status.ready{background:#1e4f2d;color:#ffffff;animation:readyGlow 2.8s ease-in-out infinite alternate}
    @keyframes readyGlow{from{transform:scale(1);box-shadow:0 0 0 rgba(0,255,120,0)}to{transform:scale(1.03);box-shadow:0 0 20px rgba(0,255,120,0.4)}}
    .asset-pill{display:inline-block;border-radius:8px;padding:6px 10px;margin:3px 4px 0 0;font-weight:600}
    .asset-video{background-color:rgba(128,0,128,0.25); color:#efe8ff}
    .asset-sound{background-color:rgba(200,50,50,0.25); color:#ffecec}
    .asset-lighting{background-color:rgba(255,235,59,0.45); color:#ffffff}
    .asset-grip{background-color:rgba(0,123,255,0.28); color:#eaf2ff}
    .asset-uncategorised{background-color:rgba(200,200,200,0.18); color:#e6eef8}
  </style>
</head>
<body>
  <header>
    <h1>Today's Collections</h1>
    <div id="clock">Loading...</div>
  </header>
  <main style="padding:16px">
    <div id="tableWrap"></div>
  </main>
  <script>
    function updateClock(){ document.getElementById("clock").textContent = new Date().toLocaleString("en-GB", { timeZone:"Europe/London" }); }
    setInterval(updateClock,1000); updateClock();

    function formatTime(dt) {
      if (!dt) return '';
      return new Date(dt).toLocaleTimeString("en-GB", {
        timeZone: "Europe/London",
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
    }

    async function fetchBookings(){
      const resp = await fetch('/api/bookings');
      const data = await resp.json();
      const list = data.bookings || [];
      let html = '<table><thead><tr><th>Time</th><th>Name</th><th>Status</th><th>Equipment</th></tr></thead><tbody>';
      for(const b of list){
        const sCls = b.status.toLowerCase().includes("ready") ? "ready" : b.status.toLowerCase().includes("prepar") ? "preparing" : "notpicked";
        html += `<tr>
          <td>${formatTime(b.startdatetime)}</td>
          <td>${b.username}</td>
          <td><span class="status ${sCls}">${b.status}</span></td>
          <td>${(b.assets||[]).map(a=>`<span class="asset-pill asset-${a.category}">${a.name}</span>`).join("")}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      document.getElementById('tableWrap').innerHTML = html;
    }
    setInterval(fetchBookings, 10000); fetchBookings();
  </script>
</body>
</html>
