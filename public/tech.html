<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Technician Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    html, body {
      margin:0; padding:0;
      overflow:hidden;
      height:100%; width:100%;
    }

    /* Scroll wrapper */
    #scrollWrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* Rotated dashboard */
    .rotate-90-ccw {
      position: absolute; /* changed from fixed */
      top: 100%;
      left: 0;
      transform-origin: left top;
      transform: rotate(-90deg);
      width: 100vh;
      height: 100vw;
      pointer-events:auto;
    }

    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#1a1024;color:#f0e6ff}
    header{
      padding:16px;
      background:#2c1952;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
    }
    h1{margin:0;font-size:20px}

    table{width:100%;border-collapse:collapse}
    th,td{padding:12px;text-align:left;vertical-align:top}
    tr:not(:first-child){border-top:1px solid rgba(255,255,255,0.08)}

    .status{font-weight:600;padding:6px 12px;border-radius:8px;display:inline-block}
    .status.notpicked{background:#6b1f1f;color:#ffecec}
    .status.preparing{background:#6b4d1f;color:#fff8e0}
    .status.ready{background:#1e4f2d;color:#ffffff;animation:readyGlow 2.8s ease-in-out infinite alternate}
    @keyframes readyGlow{from{transform:scale(1);box-shadow:0 0 0 rgba(0,255,120,0)}to{transform:scale(1.03);box-shadow:0 0 20px rgba(0,255,120,0.4)}}

    .asset-pill{
      display:inline-block;
      border-radius:8px;
      padding:6px 10px;
      margin:3px 4px 0 0;
      font-weight:600;
    }
    .asset-video{background:rgba(128,0,128,0.25); color:#efe8ff}
    .asset-sound{background:rgba(200,50,50,0.25); color:#ffecec}
    .asset-lighting{background:rgba(255,235,59,0.45); color:#ffffff}
    .asset-grip{background:rgba(0,123,255,0.28); color:#eaf2ff}
    .asset-uncategorised{background:rgba(200,200,200,0.18); color:#f0f0f0}

    .top-btn {
      padding:10px 22px;
      border-radius:30px;
      border:2px solid white;
      cursor:pointer;
      font-weight:700;
      background:white;
      color:black;
      font-size:16px;
      transition:.15s;
    }
    .top-btn.selected {
      background:#f1c232;
      border-color:#f1c232;
      color:black;
      box-shadow:0 0 10px rgba(255,200,50,0.6);
    }

    button {
      border-radius:20px !important;
      padding:6px 12px;
      border:0;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }
    .btn-preparing{background:#f1c232;color:#222}
    .btn-ready{background:#1e4f2d;color:#fff}
    .btn-clear{background:#777;color:#fff}

    .readyin-wrap{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:6px
    }
    .readyin-chip{
      font-size:12px;
      background:rgba(255,255,255,0.08);
      padding:4px 8px;
      border-radius:25px
    }
    .readyin-btn{
      padding:6px 12px;
      border-radius:25px;
      background:#333;
      color:#fff;
      font-weight:700
    }

    #clock {
      font-size:20px;
      font-weight:600;
      opacity:.9;
    }

    /* Annotation layer */
    #annotateCanvas{
      position:fixed;
      top:0; left:0;
      width:100vw; height:100vh;
      background:transparent;
      z-index:999999;

      /* IMPORTANT: this is overridden dynamically */
      touch-action:none;
    }

    .noclick { pointer-events:none !important; }

    #annotateTools {
      position:fixed;
      top:10px;
      right:180px;
      z-index:1000000;
      pointer-events:none;
    }
    #annotateToolsInner {
      transform: rotate(-90deg);
      transform-origin: top right;
      display:flex;
      flex-direction:column;
      gap:8px;
      pointer-events:auto;
    }

    .tool-btn{
      background:rgba(255,255,255,0.35);
      border-radius:24px;
      padding:8px 16px;
      font-weight:700;
      border:1px solid rgba(255,255,255,0.4);
      font-size:14px;
      color:black;
      cursor:pointer;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

<!-- Annotation Canvas -->
<canvas id="annotateCanvas"></canvas>

<!-- Toolbar -->
<div id="annotateTools">
  <div id="annotateToolsInner">
    <button class="tool-btn" onclick="toggleAnnotate()" id="toggleDrawBtn">DRAW OFF</button>
    <button class="tool-btn" onclick="undoStroke()">Undo</button>
    <button class="tool-btn" onclick="clearCanvas()">Clear</button>
    <button class="tool-btn" onclick="enableEraser()">Eraser</button>
  </div>
</div>

<script>
/* ===========================
      Annotation Logic
=========================== */

const canvas = document.getElementById("annotateCanvas");
const ctx = canvas.getContext("2d");
const scrollWrap = document.getElementById("scrollWrap");

let drawing = false;
let erasing = false;
let drawingEnabled = false;

const strokeColor = "white";
const strokeWidth = 5;

const undoStack = [];

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function saveState() {
  undoStack.push(canvas.toDataURL());
  if (undoStack.length > 40) undoStack.shift();
}

function undoStroke() {
  if (!undoStack.length) return;
  const img = new Image();
  img.src = undoStack.pop();
  img.onload = () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
  };
}

function enableEraser(){
  erasing = true;
  ctx.globalCompositeOperation = "destination-out";
}

function clearCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  undoStack.length = 0;
}

/* ===========================
   CRITICAL FIX FOR SCROLLING
=========================== */
function toggleAnnotate(){
  drawingEnabled = !drawingEnabled;

  if (drawingEnabled){
    canvas.classList.remove("noclick");
    toggleDrawBtn.textContent = "DRAW ON";
    toggleDrawBtn.style.background = "#5cff89";

    scrollWrap.style.overflow = "hidden";   // block scroll
    canvas.style.touchAction = "none";      // allow drawing

  } else {
    canvas.classList.add("noclick");
    toggleDrawBtn.textContent = "DRAW OFF";
    toggleDrawBtn.style.background = "rgba(255,255,255,0.35)";

    scrollWrap.style.overflowY = "auto";    // enable scroll
    canvas.style.touchAction = "auto";      // pass touch events through
  }
}
/* ===========================
   END FIX
=========================== */

canvas.classList.add("noclick");

canvas.addEventListener("pointerdown", e => {
  if (!drawingEnabled) return;

  saveState();
  drawing = true;

  ctx.beginPath();
  ctx.moveTo(e.clientX, e.clientY);

  ctx.globalCompositeOperation = erasing ? "destination-out" : "source-over";
});

canvas.addEventListener("pointermove", e => {
  if (!drawingEnabled || !drawing) return;

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = erasing ? 24 : strokeWidth;
  ctx.strokeStyle = strokeColor;

  ctx.lineTo(e.clientX, e.clientY);
  ctx.stroke();
});

canvas.addEventListener("pointerup", ()=>{
  drawing = false;
  erasing = false;
});

canvas.addEventListener("pointercancel", ()=>{
  drawing = false;
  erasing = false;
});
</script>


<!-- Dashboard Section -->
<div id="scrollWrap">

<div class="rotate-90-ccw">
  <header>
    <h1>Technician Dashboard</h1>

    <div style="display:flex; gap:12px;">
      <button id="btnToday" onclick="switchDay('today')" class="top-btn selected">Today</button>
      <button id="btnTomorrow" onclick="switchDay('tomorrow')" class="top-btn">Tomorrow</button>
    </div>

    <div id="clock">Loading...</div>
  </header>

  <main style="padding:16px">
    <div class="legend">
      <span class="asset-pill asset-video">Video</span>
      <span class="asset-pill asset-sound">Sound</span>
      <span class="asset-pill asset-lighting">Lighting</span>
      <span class="asset-pill asset-grip">Grip</span>
      <span class="asset-pill asset-uncategorised">Uncategorised</span>
    </div>
    <div id="tableWrap"></div>
  </main>
</div>

</div>

<script>
/* Dashboard Logic (unchanged) */
let bookings = [];
let dayMode = "today";

const btnToday = document.getElementById("btnToday");
const btnTomorrow = document.getElementById("btnTomorrow");

const tableWrap = document.getElementById("tableWrap");
const clockEl = document.getElementById("clock");

function updateClock(){
  clockEl.textContent = new Date().toLocaleString("en-GB", { timeZone:"Europe/London" });
}
setInterval(updateClock,1000);
updateClock();

function switchDay(mode){
  dayMode = mode;

  btnToday.classList.toggle("selected", mode==="today");
  btnTomorrow.classList.toggle("selected", mode==="tomorrow");

  fetchBookings();
}

function statusClass(status){
  status = status.toLowerCase();
  if (status.includes("ready")) return "ready";
  if (status.includes("prepar")) return "preparing";
  if (status.includes("not")) return "notpicked";
  return "";
}

function formatTime(dt){
  const d = new Date(dt);
  return isNaN(d) ? "" : d.toLocaleTimeString("en-GB", {hour:'2-digit',minute:'2-digit'});
}

function renderAssets(arr){
  return arr.map(a =>
    `<span class="asset-pill asset-${a.category}">${a.name}</span>`
  ).join("");
}

async function updateStatus(key,status){
  await fetch("/api/update-status", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ key, status })
  });
  fetchBookings();
}

async function setReadyIn(key, minutes){
  await fetch("/api/ready-in", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ key, minutes })
  });
  fetchBookings();
}

function renderTable(list){
  let html = `
  <table>
    <thead>
      <tr><th>Time</th><th>Name</th><th>Status</th><th>Equipment</th><th>Actions</th></tr>
    </thead>
    <tbody>
  `;

  if (!list.length){
    html += `<tr><td colspan="5">No bookings.</td></tr>`;
  } else {
    for (const b of list){
      html += `
      <tr>
        <td>${formatTime(b.startdatetime)}</td>
        <td>${b.username}</td>
        <td><span class="status ${statusClass(b.status)}">${b.status}</span></td>
        <td>${renderAssets(b.assets)}</td>
        <td>
          ${b.status==="Not Picked"
            ? `<button class="btn-preparing" onclick="updateStatus('${b._groupKey}','preparing')">Preparing</button>` : ""}
          ${b.status==="Preparing"
            ? `<button class="btn-ready" onclick="updateStatus('${b._groupKey}','ready')">Ready</button>` : ""}
          <button class="btn-clear" onclick="updateStatus('${b._groupKey}','clear')">Clear</button>

          <div class="readyin-wrap">
            <span class="readyin-chip">Ready in <b>${b.readyInMinutes}</b> min</span>
            <button class="readyin-btn" onclick="setReadyIn('${b._groupKey}', Math.max(0,${b.readyInMinutes}-5))">–5</button>
            <button class="readyin-btn" onclick="setReadyIn('${b._groupKey}', ${b.readyInMinutes}+5)">+5</button>
          </div>
        </td>
      </tr>`;
    }
  }

  html += "</tbody></table>";
  tableWrap.innerHTML = html;
}

async function fetchBookings(){
  const r = await fetch(`/api/bookings-tech?day=${dayMode}`);
  const data = await r.json();
  let list = data.bookings || [];

  list = list.filter(b =>
    !(b.statuses && b.statuses.length > 0 && b.statuses.every(st => st.includes("collected")))
  );

  list.sort((a,b)=> new Date(a.startdatetime) - new Date(b.startdatetime));

  bookings = list;
  renderTable(bookings);
}

setInterval(fetchBookings,5000);
fetchBookings();
</script>

</body>
</html>
