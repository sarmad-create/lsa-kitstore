<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Technician Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body { margin:0; padding:0; overflow:hidden; height:100%; width:100%; }
    #scrollWrap { position: relative; width: 100%; height: 100%; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; overscroll-behavior-x: contain; }
    #scrollSpacer{ width:100vh; height:1px; opacity:0; pointer-events:none; }
    .rotate-90-ccw { position: absolute; top: 100%; left: 0; transform-origin: left top; transform: rotate(-90deg); width: 100vh; height: 100vw; pointer-events:auto; }
    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#1a1024;color:#f0e6ff}
    header{ padding:16px; background:#2c1952; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    h1{margin:0;font-size:20px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px;text-align:left;vertical-align:top}
    tr:not(:first-child){border-top:1px solid rgba(255,255,255,0.08)}
    .status{font-weight:600;padding:6px 12px;border-radius:8px;display:inline-block}
    .status.notpicked{background:#6b1f1f;color:#ffecec}
    .status.preparing{background:#6b4d1f;color:#fff8e0}
    .status.ready{background:#1e4f2d;color:#ffffff;animation:readyGlow 2.8s ease-in-out infinite alternate}
    @keyframes readyGlow{from{transform:scale(1);box-shadow:0 0 0 rgba(0,255,120,0)}to{transform:scale(1.03);box-shadow:0 0 20px rgba(0,255,120,0.4)}}
    .asset-pill{ display:inline-block; border-radius:8px; padding:6px 10px; margin:3px 4px 0 0; font-weight:600; }
    .asset-video{background:rgba(128,0,128,0.25); color:#efe8ff}
    .asset-sound{background:rgba(200,50,50,0.25); color:#ffecec}
    .asset-lighting{background:rgba(255,235,59,0.45); color:#ffffff}
    .asset-grip{background:rgba(0,123,255,0.28); color:#eaf2ff}
    .asset-uncategorised{background:rgba(200,200,200,0.18); color:#f0f0f0}
    .top-btn { padding:10px 22px; border-radius:30px; border:2px solid white; cursor:pointer; font-weight:700; background:white; color:black; font-size:16px; transition:.15s; }
    .top-btn.selected { background:#f1c232; border-color:#f1c232; color:black; box-shadow:0 0 10px rgba(255,200,50,0.6); }
    button { border-radius:20px !important; padding:6px 12px; border:0; cursor:pointer; font-weight:700; font-size:14px; }
    .btn-preparing{background:#f1c232;color:#222}
    .btn-ready{background:#1e4f2d;color:#fff}
    .btn-clear{background:#777;color:#fff}
    .readyin-wrap{ display:inline-flex; align-items:center; gap:6px; margin-top:6px }
    .readyin-chip{ font-size:12px; background:rgba(255,255,255,0.08); padding:4px 8px; border-radius:25px }
    .readyin-btn{ padding:6px 12px; border-radius:25px; background:#333; color:#fff; font-weight:700 }
    #clock { font-size:20px; font-weight:600; opacity:.9; }
  </style>
</head>
<body>
<div id="scrollWrap">
  <div id="scrollSpacer"></div>
  <div class="rotate-90-ccw" id="rotatedDashboard">
    <header>
      <h1>Technician Dashboard</h1>
      <div style="display:flex; gap:12px;">
        <button id="btnToday" onclick="switchDay('today')" class="top-btn selected">Today</button>
        <button id="btnTomorrow" onclick="switchDay('tomorrow')" class="top-btn">Tomorrow</button>
      </div>
      <div id="clock">Loading...</div>
    </header>
    <main style="padding:16px">
      <div id="tableWrap"></div>
    </main>
  </div>
</div>
<script>
let bookings = []; let dayMode = "today";
const tableWrap = document.getElementById("tableWrap");
const clockEl = document.getElementById("clock");

function updateClock(){
  clockEl.textContent = new Date().toLocaleString("en-GB", { timeZone:"Europe/London" });
}
setInterval(updateClock,1000); updateClock();

function switchDay(mode){
  dayMode = mode;
  document.getElementById("btnToday").classList.toggle("selected", mode==="today");
  document.getElementById("btnTomorrow").classList.toggle("selected", mode==="tomorrow");
  fetchBookings();
}

function formatTime(dt) {
  if (!dt) return '';
  // Force Europe/London display to correct for BST offset shift
  return new Date(dt).toLocaleTimeString("en-GB", {
    timeZone: "Europe/London",
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
}

function renderTable(list){
  let html = `<table><thead><tr><th>Time</th><th>Name</th><th>Status</th><th>Equipment</th><th>Actions</th></tr></thead><tbody>`;
  for (const b of list){
    const sCls = b.status.toLowerCase().includes("ready") ? "ready" : b.status.toLowerCase().includes("prepar") ? "preparing" : "notpicked";
    html += `<tr>
      <td>${formatTime(b.startdatetime)}</td>
      <td>${b.username}</td>
      <td><span class="status ${sCls}">${b.status}</span></td>
      <td>${(b.assets||[]).map(a=>`<span class="asset-pill asset-${a.category}">${a.name}</span>`).join("")}</td>
      <td>
        ${b.status==="Not Picked" ? `<button class="btn-preparing" onclick="updateStatus('${b._groupKey}','preparing')">Preparing</button>` : ""}
        ${b.status==="Preparing" ? `<button class="btn-ready" onclick="updateStatus('${b._groupKey}','ready')">Ready</button>` : ""}
        <button class="btn-clear" onclick="updateStatus('${b._groupKey}','clear')">Clear</button>
      </td>
    </tr>`;
  }
  html += "</tbody></table>"; tableWrap.innerHTML = html;
}

async function fetchBookings(){
  const r = await fetch(`/api/bookings-tech?day=${dayMode}`);
  const data = await r.json();
  renderTable(data.bookings || []);
}
async function updateStatus(key, status){
  await fetch("/api/update-status", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({key,status}) });
  fetchBookings();
}
setInterval(fetchBookings, 10000); fetchBookings();
</script>
</body>
</html>
