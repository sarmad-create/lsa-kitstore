<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Technician Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    html, body {
      margin:0; padding:0;
      overflow:hidden;
      height:100%; width:100%;
    }

    /* Dashboard rotated 90deg CCW */
    .rotate-90-ccw {
      position: fixed;
      top: 100%;
      left: 0;
      transform-origin: left top;
      transform: rotate(-90deg);
      width: 100vh;
      height: 100vw;
      pointer-events:auto;
    }

    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#1a1024;color:#f0e6ff}
    header{
      padding:16px;
      background:#2c1952;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
    }
    h1{margin:0;font-size:20px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px;text-align:left;vertical-align:top}
    tr:not(:first-child){border-top:1px solid rgba(255,255,255,0.08)}

    .status{font-weight:600;padding:6px 12px;border-radius:8px;display:inline-block}
    .status.notpicked{background:#6b1f1f;color:#ffecec}
    .status.preparing{background:#6b4d1f;color:#fff8e0}
    .status.ready{background:#1e4f2d;color:#ffffff;animation:readyGlow 2.8s ease-in-out infinite alternate}
    @keyframes readyGlow{from{transform:scale(1);box-shadow:0 0 0 rgba(0,255,120,0)}to{transform:scale(1.03);box-shadow:0 0 20px rgba(0,255,120,0.4)}}

    .asset-pill{
      display:inline-block;
      border-radius:8px;
      padding:6px 10px;
      margin:3px 4px 0 0;
      font-weight:600
    }
    .asset-video{background-color:rgba(128,0,128,0.25); color:#efe8ff}
    .asset-sound{background-color:rgba(200,50,50,0.25); color:#ffecec}
    .asset-lighting{background-color:rgba(255,235,59,0.45); color:#ffffff}
    .asset-grip{background-color:rgba(0,123,255,0.28); color:#eaf2ff}
    .asset-uncategorised{background-color:rgba(200,200,200,0.18); color:#f0f0f0}

    /* Top Today/Tomorrow selector */
    .top-btn {
      padding:12px 26px;
      border-radius:30px;
      border:2px solid white;
      cursor:pointer;
      font-weight:700;
      background:white;
      color:black;
      font-size:18px;
      transition:0.15s;
    }
    .top-btn.selected {
      background:#f1c232;
      border-color:#f1c232;
      color:black;
      box-shadow:0 0 10px rgba(255,200,50,0.6);
    }

    /* Action buttons */
    button {
      border-radius:25px !important;
      padding:6px 14px;
      border:0;
      cursor:pointer;
      font-weight:700;
    }
    .btn-preparing{background:#f1c232;color:#222}
    .btn-ready{background:#1e4f2d;color:#fff}
    .btn-clear{background:#777;color:#fff}

    .readyin-wrap{display:inline-flex;align-items:center;gap:6px;margin-top:6px}
    .readyin-chip{font-size:12px;background:rgba(255,255,255,0.08);padding:4px 8px;border-radius:25px}
    .readyin-btn{padding:6px 12px;border-radius:25px;background:#333;color:#fff;font-weight:700}

    #clock {
      font-size:20px;
      font-weight:600;
      opacity:.9;
    }

    /* Annotation canvas */
    #annotateCanvas{
      position:fixed;
      top:0; left:0;
      width:100vw; height:100vh;
      pointer-events:auto;
      touch-action:none;
      background:transparent;
      z-index:999999;
    }
    .hiddenCanvas{
      opacity:0 !important;
      pointer-events:none !important;
    }

    /* Toolbar container (top-right) */
    #annotateTools {
      position:fixed;
      top:10px;
      right:300px;
      z-index:1000000;
      pointer-events:none;
    }

    /* Rotated inner section */
    #annotateToolsInner {
      transform: rotate(-90deg);
      transform-origin: top right;
      display:flex;
      flex-direction:column;
      gap:12px;
      pointer-events:auto;
    }

    .tool-btn{
      background:rgba(255,255,255,0.35);
      color:black;
      border-radius:30px;
      padding:12px 20px;
      font-weight:700;
      border:1px solid rgba(255,255,255,0.4);
      cursor:pointer;
      font-size:17px;
      backdrop-filter: blur(4px);
    }
    .tool-color{
      width:34px; height:34px;
      opacity:0.7;
      border-radius:50%;
      border:2px solid #fff;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <!-- Annotation Canvas -->
  <canvas id="annotateCanvas"></canvas>

  <!-- Top-Right Rotated Annotation Toolbar -->
  <div id="annotateTools">
    <div id="annotateToolsInner">

      <button class="tool-btn" onclick="toggleAnnotate()">✏️ Draw ON/OFF</button>
      <button class="tool-btn" onclick="undoStroke()">↩️ Undo</button>
      <button class="tool-btn" onclick="clearCanvas()">🧽 Clear</button>
      <button class="tool-btn" onclick="enableEraser()">🩹 Eraser</button>

      <div style="display:flex; gap:8px;">
        <div class="tool-color" style="background:red" onclick="setColor('red')"></div>
        <div class="tool-color" style="background:yellow" onclick="setColor('yellow')"></div>
        <div class="tool-color" style="background:cyan" onclick="setColor('cyan')"></div>
        <div class="tool-color" style="background:lime" onclick="setColor('lime')"></div>
        <div class="tool-color" style="background:white" onclick="setColor('white')"></div>
      </div>

    </div>
  </div>

  <script>
    /* =============================
       Annotation System + Undo
       ============================= */

    const canvas = document.getElementById("annotateCanvas");
    const ctx = canvas.getContext("2d");

    let drawing = false;
    let erasing = false;

    let strokeColor = "yellow";
    let strokeWidth = 5;

    /* Undo stack */
    let undoStack = [];

    function saveState() {
      undoStack.push(canvas.toDataURL());
      if (undoStack.length > 40) undoStack.shift();
    }

    function undoStroke() {
      if (undoStack.length === 0) return;
      const img = new Image();
      const lastState = undoStack.pop();
      img.src = lastState;
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
      };
    }

    function resizeCanvas(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function setColor(c){
      strokeColor = c;
      erasing = false;
      ctx.globalCompositeOperation = "source-over";
    }

    function enableEraser(){
      erasing = true;
      ctx.globalCompositeOperation = "destination-out"; 
    }

    function clearCanvas(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      undoStack = [];
    }

    function toggleAnnotate(){
      canvas.classList.toggle("hiddenCanvas");
    }

    canvas.addEventListener("pointerdown", e => {
      saveState();
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(e.clientX, e.clientY);
    });

    canvas.addEventListener("pointermove", e => {
      if(!drawing) return;

      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.lineWidth = erasing ? 24 : strokeWidth;

      if (!erasing) ctx.globalCompositeOperation = "source-over";

      ctx.strokeStyle = erasing ? "rgba(0,0,0,1)" : strokeColor;

      ctx.lineTo(e.clientX, e.clientY);
      ctx.stroke();
    });

    canvas.addEventListener("pointerup", ()=> drawing=false);
    canvas.addEventListener("pointercancel", ()=> drawing=false);
  </script>

  <!-- ORIGINAL DASHBOARD -->
  <div class="rotate-90-ccw">
    <header>
      <h1>Technician Dashboard</h1>

      <div style="display:flex; gap:12px;">
        <button id="btnToday" onclick="switchDay('today')" class="top-btn selected">Today</button>
        <button id="btnTomorrow" onclick="switchDay('tomorrow')" class="top-btn">Tomorrow</button>
      </div>

      <div id="clock">Loading...</div>
    </header>

    <main style="padding:16px">
      <div class="legend">
        <span class="asset-pill asset-video">Video</span>
        <span class="asset-pill asset-sound">Sound</span>
        <span class="asset-pill asset-lighting">Lighting</span>
        <span class="asset-pill asset-grip">Grip</span>
        <span class="asset-pill asset-uncategorised">Uncategorised</span>
      </div>
      <div id="tableWrap"></div>
    </main>
  </div>

  <script>
    /* =============================
       ORIGINAL DASHBOARD LOGIC
       ============================= */
    let bookings = [];
    let dayMode = "today";

    const tableWrap = document.getElementById('tableWrap');
    const clockEl = document.getElementById('clock');
    const btnToday = document.getElementById("btnToday");
    const btnTomorrow = document.getElementById("btnTomorrow");

    function updateClock(){
      clockEl.textContent=new Date().toLocaleString();
    }
    setInterval(updateClock,1000);
    updateClock();

    function switchDay(mode){
      dayMode=mode;
      btnToday.classList.toggle("selected", mode==="today");
      btnTomorrow.classList.toggle("selected", mode==="tomorrow");
      fetchBookings();
    }

    function statusClass(status){
      const t=(status||'').toLowerCase();
      if(t.includes('ready')) return 'ready';
      if(t.includes('prepar')) return 'preparing';
      if(t.includes('not')) return 'notpicked';
      return t.replace(/\s+/g,'');
    }

    function formatTime(dt){
      if(!dt) return '';
      const d=new Date(dt);
      return isNaN(d)?dt:d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    }

    function renderAssets(assets){
      return (assets||[]).map(a=>{
        const name=typeof a==='string'?a:(a.name||'');
        const cat=(typeof a==='object'&&a.category)?a.category:'uncategorised';
        const cls=['video','sound','lighting','grip','uncategorised'].includes(cat.toLowerCase())?cat.toLowerCase():'uncategorised';
        return `<span class="asset-pill asset-${cls}">${name}</span>`;
      }).join('');
    }

    async function updateStatus(key,status){
      await fetch('/api/update-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,status})});
      fetchBookings();
    }

    async function setReadyIn(key,minutes){
      await fetch('/api/ready-in',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,minutes})});
      fetchBookings();
    }

    function renderTable(list){
      let html='<table><thead><tr><th>Time</th><th>Name</th><th>Status</th><th>Equipment</th><th>Actions</th></tr></thead><tbody>';
      if(!list.length){
        html+='<tr><td colspan="5">No bookings for selected day.</td></tr>';
      } else {
        for(const b of list){
          const time=formatTime(b.startdatetime);
          const cls=statusClass(b.status);
          const showReady=b.status!=="Ready for Collection";
          const readyIn=Number(b.readyInMinutes||0);

          html+=`
          <tr>
            <td>${time}</td>
            <td>${b.username}</td>
            <td><span class="status ${cls}">${b.status}</span></td>
            <td>${renderAssets(b.assets)}</td>
            <td>
              ${b.status==="Not Picked" ? `<button class="btn-preparing" onclick="updateStatus('${b._groupKey}','preparing')">Preparing</button>`:''}
              ${b.status==="Preparing" ? `<button class="btn-ready" onclick="updateStatus('${b._groupKey}','ready')">Ready</button>`:''}
              <button class="btn-clear" onclick="updateStatus('${b._groupKey}','clear')">Clear</button>

              ${showReady?`
                <div class="readyin-wrap">
                  <span class="readyin-chip">Ready in <b>${readyIn}</b> min</span>
                  <button class="readyin-btn" onclick="setReadyIn('${b._groupKey}', Math.max(0,${readyIn}-5))">–5</button>
                  <button class="readyin-btn" onclick="setReadyIn('${b._groupKey}', ${readyIn}+5)">+5</button>
                </div>`:''}
            </td>
          </tr>`;
        }
      }

      html+='</tbody></table>';
      tableWrap.innerHTML=html;
    }

    async function fetchBookings(){
      const resp = await fetch(`/api/bookings?day=${dayMode}`);
      const data = await resp.json();
      bookings = (data.success && Array.isArray(data.bookings)) ? data.bookings : [];
      bookings.sort((a,b)=>new Date(a.startdatetime)-new Date(b.startdatetime));
      renderTable(bookings);
    }

    setInterval(fetchBookings,5000);
    fetchBookings();
  </script>

</body>
</html>
